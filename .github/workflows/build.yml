name: Legend Android 15 Compiler with Google Services

on:
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-22.04
    steps:
    - name: Freeing Up Server Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc

    - name: Setting Up Build Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Initializing Tool Repo & Shallow Sync
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH
        mkdir -p ~/android && cd ~/android
        repo init -u https://github.com -b lineage-22.0 --depth=1
        
        # Inject Local Manifest Map combining your code and MediaTek dependencies
        mkdir -p .repo/local_manifests
        cat <<EOF > .repo/local_manifests/p10.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <remote name="github" fetch="https://github.com" />
          <project path="device/wisephone/p10" name="divdev-source969/lineageos22-for-wisetech-p10" remote="github" revision="main" />
          <project path="hardware/mediatek" name="maximus-sallam/android_hardware_mediatek" remote="github" revision="lineage-17.1" clone-depth="1" />
          <project path="device/mediatek/common" name="maximus-sallam/android_device_mediatek" remote="github" revision="lineage-17.1" clone-depth="1" />
        </manifest>
        EOF

        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Fetching Lightweight Android 15 Google Apps
      run: |
        cd ~/android
        # Automatically pull MindTheGapps implementation structures into the build platform
        git clone https://gitlab.com vendor/gapps -b sigma --depth=1

    - name: Running The Compiler
      run: |
        cd ~/android
        source build/envsetup.sh
        lunch lineage_p10-userdebug
        mka bacon -j$(nproc --all)
